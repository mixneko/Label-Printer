# 推送版本標籤（vX.Y.Z）時：在 GitHub 上從原始碼檢查、建置，並自動建立 Release 附上安裝檔與免安裝版。
# 手動執行（Actions → Release → Run workflow）只建置並把檔案放成 Artifact，不建立 Release，適合試跑。
#
# 之後若取得 SignPath Foundation 的簽章，簽章步驟加在「建置」與「發布」之間。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # 只在 GitHub 上跑（Gitea 若啟用 Actions 也不會誤觸發）
    if: github.server_url == 'https://github.com'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 版本號檢查（標籤、package.json、Cargo.toml、tauri.conf.json 必須一致）
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').version")
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "package.json=$PKG tauri.conf.json=$CONF Cargo.toml=$CARGO"
          if [ "$PKG" != "$CONF" ] || [ "$PKG" != "$CARGO" ]; then echo "::error::三個檔案的版本號不一致"; exit 1; fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$PKG" ]; then
            echo "::error::標籤 ${GITHUB_REF_NAME} 與程式版本 v$PKG 不一致"; exit 1
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: 型別檢查
        run: npx tsc --noEmit

      - name: 翻譯檢查（缺漏、多餘、佔位不一致都算失敗）
        run: npm run i18n:check -- --strict

      - name: Rust 單元測試
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: 確認更新簽章金鑰已設定
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::缺少 Secret TAURI_SIGNING_PRIVATE_KEY（Settings → Secrets and variables → Actions）。沒有它無法簽出自動更新用的檔案"
            exit 1
          fi

      - name: 建置（免安裝 exe + NSIS 安裝檔 + 更新簽章）
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # 只在這裡開啟 createUpdaterArtifacts：本機與 Gitea 的建置沒有私鑰，不產生更新簽章
        run: npm run tauri build -- --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: 整理要發布的檔案
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          mkdir -p dist-release
          cp "src-tauri/target/release/Label Printer.exe" "dist-release/Label Printer_${VER}_x64-portable.exe"
          cp "src-tauri/target/release/bundle/nsis/Label Printer_${VER}_x64-setup.exe" "dist-release/Label Printer_${VER}_x64-setup.exe"
          cp "src-tauri/target/release/bundle/nsis/Label Printer_${VER}_x64-setup.exe.sig" "dist-release/Label Printer_${VER}_x64-setup.exe.sig"
          # 試跑也先產生一份 latest.json 驗證流程（標籤推送時發布步驟會用真正的說明重做）
          printf 'Label Printer v%s\n' "$VER" > trial-notes.txt
          node scripts/make-latest-json.mjs "$VER" "v$VER" trial-notes.txt dist-release
          ls -l dist-release

      - uses: actions/upload-artifact@v6
        with:
          name: label-printer-${{ steps.ver.outputs.version }}
          path: dist-release/*
          if-no-files-found: error

      - name: 建立 Release 並上傳（只在標籤推送時）
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 標籤說明（annotated tag 的訊息）當作 Release 說明；取不到就用預設文字
          git fetch --force --tags origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" || true
          NOTES=$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)')
          if [ -z "${NOTES// /}" ]; then NOTES="Label Printer ${GITHUB_REF_NAME}"; fi
          printf '%s\n' "$NOTES" > release-notes.txt
          # 自動更新用的 latest.json（內含更新檔網址與簽章，程式只在簽章驗證通過時才安裝）
          node scripts/make-latest-json.mjs "${{ steps.ver.outputs.version }}" "${GITHUB_REF_NAME}" release-notes.txt dist-release
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist-release/* --clobber
            gh release edit "${GITHUB_REF_NAME}" --notes-file release-notes.txt
          else
            gh release create "${GITHUB_REF_NAME}" dist-release/* --title "${GITHUB_REF_NAME}" --notes-file release-notes.txt
          fi

          # 核對：latest.json 裡的更新檔網址，檔名必須真的存在於這個 Release（GitHub 會改寫檔名裡的空白）
          URL_NAME=$(node -p "require('./dist-release/latest.json').platforms['windows-x86_64'].url.split('/').pop()")
          if ! gh release view "${GITHUB_REF_NAME}" --json assets -q '.assets[].name' | grep -Fxq "$URL_NAME"; then
            echo "::error::Release 內找不到 latest.json 指向的檔案：$URL_NAME"
            gh release view "${GITHUB_REF_NAME}" --json assets -q '.assets[].name'
            exit 1
          fi
          echo "latest.json 指向的 $URL_NAME 確實存在"

  # 正式版（標籤沒有 -a／-b 這類預發行後綴）發布完成後，自動向 winget 送出版本更新（Pull Request 到 microsoft/winget-pkgs）。
  # 用 Microsoft 官方的 wingetcreate；需要 Secret WINGET_TOKEN（見 winget/README.md），沒設定就略過，不影響上面的發布。
  # 第一個版本要先手動送過一次，winget 上有了這個套件之後，這裡才接得上。
  winget:
    needs: build
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-') && github.server_url == 'https://github.com'
    runs-on: windows-latest
    permissions: {}
    steps:
      - name: 送出 winget 更新
        shell: pwsh
        # 失敗（例如 winget 上還沒有這個套件、或權杖過期）只顯示警告，不讓整個發布流程變紅
        continue-on-error: true
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if (-not $env:WINGET_TOKEN) {
            Write-Host "::notice::沒有設定 Secret WINGET_TOKEN，略過 winget 自動更新（設定方式見 winget/README.md）"
            exit 0
          }
          $ver = $env:TAG.TrimStart('v')
          $url = "https://github.com/$($env:REPO)/releases/download/$($env:TAG)/Label.Printer_$($ver)_x64-setup.exe"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          ./wingetcreate.exe update b51.tw.LabelPrinter --version $ver --urls $url --submit --token $env:WINGET_TOKEN
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::wingetcreate 失敗（結束代碼 $LASTEXITCODE）。請確認 winget 上已有 Mixneko.LabelPrinter、權杖有效，或手動提交"; exit $LASTEXITCODE }
