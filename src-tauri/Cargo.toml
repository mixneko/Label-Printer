[package]
name = "label-printer"
version = "1.0.6"
description = "標籤列印排版軟體"
license = "MIT"
edition = "2021"

[lib]
name = "label_printer_lib"
# 只做 Windows 桌面版；手機版才需要 staticlib／cdylib，每多一種打包就多花時間
crate-type = ["rlib"]

[profile.release]
opt-level = "s"
lto = "thin"       # 比 true 快很多，體積只略大
codegen-units = 16 # 平行編譯，吃滿多核心
panic = "abort"
strip = true

# 測試版用（scripts/build.mjs 依版本號自動選）：不做整體最佳化、只重編改過的部分；執行檔略大一點
[profile.fast]
inherits = "release"
lto = false
incremental = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
calamine = { version = "0.38.0", features = ["chrono"] }
# 開啟活頁簿前先掃描壓縮包（見 guard.rs）；與 calamine 相依的是同一個 zip，只用讀取與 deflate
zip = { version = "9.7", default-features = false, features = ["deflate"] }
csv = "1.4.0"
encoding_rs = "0.8.44"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["alloc"] }
rusqlite = { version = "0.43.0", features = ["bundled", "column_decltype"] }
odbc-api = "30.1.0"
# 伺服器型資料庫改用純 Rust 用戶端（不需要使用者另外安裝 ODBC 驅動程式）；TLS 一律走 Windows 內建的 SChannel（native-tls），不另外帶加密函式庫
# 安全性評估見 AGENTS.md「原生資料庫連線」：tokio-postgres 必須 >= 0.7.18（RUSTSEC-2026-0178）、tokio 必須 >= 1.54.1（RUSTSEC-2026-0384）
tiberius = { version = "0.13", default-features = false, features = ["tds73", "winauth", "native-tls"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures-util = { version = "0.3", default-features = false }
mysql = { version = "28", default-features = false, features = ["native-tls", "minimal-rust", "buffer-pool"] }
postgres = "0.19"
tokio-postgres = ">=0.7.18"
postgres-native-tls = "0.5.3"
native-tls = "0.2.18"
tokio = { version = ">=1.54.1", features = ["rt", "net", "time"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Security", "Win32_System_Threading"] }

[dev-dependencies]
rust_xlsxwriter = "0.102.0"
