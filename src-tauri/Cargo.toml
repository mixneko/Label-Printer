[package]
name = "label-printer"
version = "0.8.7"
description = "標籤列印排版軟體"
license = "MIT"
edition = "2021"

[lib]
name = "label_printer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = "thin"       # 比 true 快很多，體積只略大
codegen-units = 16 # 平行編譯，吃滿多核心
panic = "abort"
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
calamine = { version = "0.38.0", features = ["chrono"] }
csv = "1.4.0"
encoding_rs = "0.8.44"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["alloc"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing"] }

[dev-dependencies]
rust_xlsxwriter = "0.102.0"
